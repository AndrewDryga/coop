name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Least privilege: CI only reads the repo. Set it explicitly rather than inheriting
# the (mutable) repo default, so a later default change can't silently grant write.
permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select only proven metadata changes
        id: scope
        run: python3 tools/ci_scope.py
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_WORKFLOW_REF: ${{ github.workflow_ref }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_SHA: ${{ github.sha }}

  checks:
    needs: scope
    if: needs.scope.outputs.mode != 'metadata'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: [check-static, check-unit, check-process, check-race]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true # read-only CI only; the publisher never consumes this cache
          cache-dependency-path: |
            go.mod
            go.sum
            internal/box/staticcheck.mod
            internal/box/staticcheck.sum
      - name: install Go analyzers at the repo's pins
        if: matrix.target == 'check-static'
        run: |
          make install-staticcheck
          go install golang.org/x/vuln/cmd/govulncheck@"$(make -s govulncheck-version)"
      - name: install Git LFS for source and workspace integration tests
        run: sudo apt-get update && sudo apt-get install -y git-lfs
      - name: Make-owned free checks
        run: make "${{ matrix.target }}"

  metadata:
    needs: scope
    if: needs.scope.outputs.mode == 'metadata'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            internal/box/staticcheck.mod
            internal/box/staticcheck.sum
      - name: Make-owned metadata checks
        run: make check-metadata

  # Keep the existing required status. Skipped dependencies are not proof of a pass.
  # This job reads only status data: no checkout, cache, action or repository code.
  check:
    name: check
    if: always()
    needs: [scope, checks, metadata, doctor, review-writes]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected check and runtime boundary
        env:
          CI_MODE: ${{ needs.scope.outputs.mode }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          needed = json.loads(os.environ["CI_RESULTS"])
          outcomes = tuple(needed.get(name, {}).get("result", "") for name in
                           ("scope", "checks", "metadata", "doctor", "review-writes"))
          state = (os.environ["CI_MODE"], *outcomes)
          accepted = {
              ("broad", "success", "success", "skipped", "success", "success"),
              ("metadata", "success", "skipped", "success", "success", "success"),
          }
          if state not in accepted:
              raise SystemExit("Selected CI checks did not all succeed.")
          if state[0] == "metadata":
              print("Metadata checks passed; broad free checks were not run.")
          else:
              print("All free checks and runtime jobs passed.")
          PY

  # Exercise the real container boundary per runtime, so a change that breaks isolation,
  # process reaping, signal forwarding, or a runtime's run-args fails CI. (The fork-merge
  # hardening test already runs in `check` via `go test`.) Docker is the one supported
  # runtime CI can drive and is blocking. Apple's `container` needs macOS 26+ runners, so
  # it isn't covered here yet — the matrix is where it lands when they exist.
  doctor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            internal/box/staticcheck.mod
            internal/box/staticcheck.sum
      - name: doctor
        run: make doctor
        env:
          COOP_RUNTIME: ${{ matrix.runtime }}
      - name: init process contract
        run: make box-runtime-e2e
        env:
          COOP_RUNTIME: ${{ matrix.runtime }}

  # Unit tests pin the mount arguments, but this boundary matters at runtime: the whole repository,
  # including task queues, stays read-only during report-only review. Keep it separate
  # from the default gate so local `make check` remains container-runtime independent.
  review-writes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            internal/box/staticcheck.mod
            internal/box/staticcheck.sum
      - name: prove report-only review mounts at the Docker boundary
        run: make review-writes-e2e
