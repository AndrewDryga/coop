name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo. Set it explicitly rather than inheriting
# the (mutable) repo default, so a later default change can't silently grant write.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false # don't leave the token in .git/config for later steps
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod # pin the toolchain to the repo, not a floating "stable"
          cache: false # no Actions cache → no cache-poisoning surface (the build is zero-dep)
      - name: install Go analyzers at the repo's pins
        # The Makefile owns both versions and the gate rejects any other builds, so CI and a
        # laptop cannot analyze with different rule or vulnerability sets. The other required
        # tools, shellcheck and python3, are preinstalled on the runner image.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@"$(make -s staticcheck-version)"
          go install golang.org/x/vuln/cmd/govulncheck@"$(make -s govulncheck-version)"
      - name: gate
        # ONE recipe: everything this job checks is `make check` — the same target a laptop and a
        # box run — so the two can never drift again. A new check goes in the Makefile, never as a
        # step here. (The container-boundary jobs below are the deliberate exception: they need a
        # real runtime, which `make check` deliberately does not.)
        run: make check

  # Exercise the real container boundary per runtime, so a change that breaks isolation,
  # process reaping, signal forwarding, or a runtime's run-args fails CI. (The fork-merge
  # hardening test already runs in `check` via `go test`.) docker and podman (rootless on
  # the runner) are both blocking. Apple's `container` needs macOS 26+ runners, so it isn't
  # covered here yet.
  doctor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: install podman
        if: matrix.runtime == 'podman'
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: build
        run: go build -o coop .
      - name: doctor
        run: ./coop doctor
        env:
          COOP_RUNTIME: ${{ matrix.runtime }}
      - name: init process contract
        run: make box-runtime-e2e
        env:
          COOP_RUNTIME: ${{ matrix.runtime }}

  # Unit tests pin the mount arguments, but this boundary matters at runtime: the whole repository,
  # including task queues, stays read-only during report-only review. Keep it separate
  # from the default gate so local `make check` remains container-runtime independent.
  review-writes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: prove report-only review mounts at the Docker boundary
        run: make review-writes-e2e
