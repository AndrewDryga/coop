name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Least privilege: CI only reads the repo. Set it explicitly rather than inheriting
# the (mutable) repo default, so a later default change can't silently grant write.
permissions:
  contents: read

jobs:
  # One runner per Make owner in the Makefile's CI_OWNERS. The race suite's long pole,
  # internal/sessionsvc, and the scripted provider suite each run as two shards, so no owner
  # holds the others up for long (the race job took 13 minutes while the rest took 5 to 7).
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        target: [check-static, check-unit, check-process-loop, check-process-rest, check-race-rest, check-race-sessionsvc-1, check-race-sessionsvc-2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # setup-go keys its cache on the dependency files alone, so every owner restored whatever
      # the first to finish had saved, and the race owners rebuilt everything with -race. Each
      # owner keeps its own modules and compiled objects instead, newest main push first.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: restore this owner's Go modules and compiled objects
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('go.mod', 'go.sum', 'tools/staticcheck.mod', 'tools/staticcheck.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('go.mod', 'go.sum', 'tools/staticcheck.mod', 'tools/staticcheck.sum') }}-
      - name: install Go analyzers at the repo's pins
        if: matrix.target == 'check-static'
        run: |
          make install-staticcheck
          go install golang.org/x/vuln/cmd/govulncheck@"$(make -s govulncheck-version)"
      - name: Make-owned free checks
        run: make "${{ matrix.target }}"
      # Read-only CI only: pull requests and tags restore main's objects and save none, and the
      # publisher never consumes them. Behavioral tests still rerun (-count=1).
      - name: save this owner's Go modules and compiled objects
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('go.mod', 'go.sum', 'tools/staticcheck.mod', 'tools/staticcheck.sum') }}-${{ github.sha }}

  # The required status. It runs after a failure too and passes only when every job it needs
  # succeeded: a failed, cancelled or skipped job is not a pass. It reads only their results,
  # with no checkout, cache, action or repository code.
  check:
    name: check
    if: always()
    needs: [checks, doctor, review-writes]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check and runtime boundary
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [ "$RESULTS" != 'success success success' ]; then
            echo "Every needed job must succeed; their results: $RESULTS"
            exit 1
          fi
          echo 'All free checks and runtime jobs passed.'

  # Exercise the real container boundary per runtime, so a change that breaks isolation,
  # process reaping, signal forwarding, or a runtime's run-args fails CI. (The fork-merge
  # hardening test already runs in `check` via `go test`.) Docker is the one supported
  # runtime CI can drive and is blocking. Apple's `container` needs macOS 26+ runners, so
  # it isn't covered here yet — the matrix is where it lands when they exist.
  doctor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            tools/staticcheck.mod
            tools/staticcheck.sum
      - name: doctor
        run: make doctor
        env:
          COOP_RUNTIME: ${{ matrix.runtime }}
      - name: init process contract
        run: make box-runtime-e2e
        env:
          COOP_RUNTIME: ${{ matrix.runtime }}

  # Unit tests pin the mount arguments, but this boundary matters at runtime: the whole repository,
  # including task queues, stays read-only during report-only review. Keep it separate
  # from the default gate so local `make check` remains container-runtime independent.
  review-writes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            tools/staticcheck.mod
            tools/staticcheck.sum
      - name: prove report-only review mounts at the Docker boundary
        run: make review-writes-e2e
