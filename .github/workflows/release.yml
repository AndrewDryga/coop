name: release

on:
  push:
    tags: ['v*']

# Least privilege at the top; the release job is granted what it needs, below.
permissions:
  contents: read

jobs:
  qualify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  goreleaser:
    needs: qualify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release + upload the built assets
      id-token: write # keyless cosign signing + build provenance (Sigstore OIDC)
      attestations: write # record the build-provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false # goreleaser publishes via GITHUB_TOKEN (env), not git creds
      - name: Validate event tag and finalized release notes
        run: python3 tools/release_preflight.py notes "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod # reproducible toolchain for the published binaries
          cache: false # no cache → a poisoned cache can't reach a release artifact
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.1' # pin cosign so its CLI defaults can't drift the release
      # Point-in-time recheck, not an atomic lock. Keep v* tag update/deletion rules
      # enforced; trusted bypass actors must not change tags during publication.
      - name: Recheck remote tag identity before publication
        run: python3 tools/release_preflight.py verify-remote "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
        with:
          version: 'v2.16.0' # pin the goreleaser binary, not a floating "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      # Cryptographic proof each archive was built by this workflow. Verify with:
      #   gh attestation verify coop_<ver>_<os>_<arch>.tar.gz --repo AndrewDryga/coop
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: 'dist/coop_*.tar.gz'
