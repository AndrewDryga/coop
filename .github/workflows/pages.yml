name: pages

# Deploy the static site in site/ to GitHub Pages. No build step: the site is static
# HTML/CSS/JS, and its generated pages are committed (tools/gen_site.py); this job just uploads it,
# with the repo's install.sh beside it so coop.dryga.com/install.sh is always the script at main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ['site/**', 'install.sh', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel an older Pages deploy when a newer one is queued.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      # actions/upload-pages-artifact is a composite that nests a tag-pinned
      # actions/upload-artifact, which this repo's "every action SHA-pinned" policy
      # rejects. Replicate it inline: its exact tar, then a SHA-pinned upload-artifact.
      # The artifact MUST be named "github-pages" so deploy-pages picks it up.
      # Copied at deploy time, never committed under site/, so the published installer can't drift
      # from the one in the repo (tools/test_site_content.py checks both).
      - name: Publish install.sh with the site
        run: cp install.sh site/install.sh
      - name: Archive the site into a Pages artifact
        run: |
          tar \
            --dereference --hard-dereference \
            --directory site \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
